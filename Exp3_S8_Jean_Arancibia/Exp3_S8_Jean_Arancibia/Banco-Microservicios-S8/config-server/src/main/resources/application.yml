server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:classpath:/config-repo/}
infra:
  user: ${CLOUD_USER:cloud}
  password: ${CLOUD_PASSWORD:CloudLocal2026!}
management:
  endpoints:
    web:
      exposure:
        include: health,info
